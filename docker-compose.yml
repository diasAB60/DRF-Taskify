version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taskify_db_container
    environment:
      POSTGRES_DB: taskify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diyas2006
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: taskify_web_container
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=taskify_db
      - DB_USER=postgres
      - DB_PASSWORD=diyas2006
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data: